name: Release

# 手动填写版本号后，构建并发布一个 GitHub Release。
# Release 的正文取自仓库根目录 CHANGELOG.md 中与该版本号对应的小节。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号，例如 1.2.0 或 1.2.0-beta.1（不要带 v 前缀）
        required: true
        type: string
      prerelease:
        description: 标记为预发布版本
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验版本号
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:INPUT_VERSION.Trim()
          if ($version.StartsWith('v') -or $version.StartsWith('V')) {
            throw "版本号不要带 v 前缀：$version。请填写 $($version.Substring(1))。"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "版本号格式不正确：$version。请使用 1.2.3 或 1.2.3-beta.1 这样的形式。"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # csproj 里写着固定的 1.0.0.0，发布时必须同时覆盖程序集版本与文件版本。
          $assembly = ($version -split '-')[0] + ".0"
          "APP_ASSEMBLY_VERSION=$assembly" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "准备发布 $version（程序集版本 $assembly，标签 v$version）。"

      - name: 检查标签是否已被占用
        shell: pwsh
        run: |
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "无法读取远端标签。" }
          if ($existing) {
            throw "标签 $env:RELEASE_TAG 已存在。请换一个版本号，或先删除旧标签和 Release。"
          }

      - name: 从 CHANGELOG.md 读取更新内容
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          if (-not (Test-Path $path)) { throw "仓库根目录缺少 CHANGELOG.md，无法生成 Release 内容。" }

          $lines = @(Get-Content -Path $path -Encoding utf8)
          $head = '^##\s+\[?v?' + [regex]::Escape($env:APP_VERSION) + '\]?(?:\s*[-—–].*)?\s*$'

          # 代码块里的示例标题不算真正的版本小节。
          $fenced = New-Object 'bool[]' ($lines.Count + 1)
          $inFence = $false
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\s*(```|~~~)') { $fenced[$i] = $true; $inFence = -not $inFence; continue }
            $fenced[$i] = $inFence
          }

          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if (-not $fenced[$i] -and $lines[$i] -match $head) { $start = $i; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md 中没有找到 $env:APP_VERSION 的小节。请先补上 `"## [$env:APP_VERSION]`" 标题及其内容。"
          }

          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if (-not $fenced[$i] -and $lines[$i] -match '^##\s') { break }
            $body.Add($lines[$i])
          }
          while ($body.Count -gt 0 -and [string]::IsNullOrWhiteSpace($body[0])) { $body.RemoveAt(0) }
          while ($body.Count -gt 0 -and [string]::IsNullOrWhiteSpace($body[$body.Count - 1])) { $body.RemoveAt($body.Count - 1) }

          if ($body.Count -eq 0) {
            throw "CHANGELOG.md 中 $env:APP_VERSION 的小节是空的，请补充更新内容。"
          }

          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notes -Value ($body -join "`n") -Encoding utf8
          "NOTES_FILE=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "已读取 $env:APP_VERSION 的更新内容，共 $($body.Count) 行。"

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 发布应用
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "publish"
          dotnet publish "FocusMinecraftLauncher/FocusMinecraftLauncher.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$env:APP_VERSION" `
            "-p:AssemblyVersion=$env:APP_ASSEMBLY_VERSION" `
            "-p:FileVersion=$env:APP_ASSEMBLY_VERSION" `
            "-p:InformationalVersion=$env:APP_VERSION" `
            "-p:DebugType=none" `
            --output $output
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败，退出码 $LASTEXITCODE。" }
          if (-not (Test-Path (Join-Path $output "FocusMinecraftLauncher.exe"))) {
            throw "发布结果里没有 FocusMinecraftLauncher.exe，请检查项目输出名。"
          }
          "PUBLISH_DIR=$output" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 打包产物
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "FocusMinecraftLauncher-$env:APP_VERSION-win-x64.zip"
          Compress-Archive -Path (Join-Path $env:PUBLISH_DIR '*') -DestinationPath $zip -CompressionLevel Optimal
          "ASSET_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "已打包 $(Split-Path -Leaf $zip)。"

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $flags = @(
            "--title", "v$env:APP_VERSION",
            "--notes-file", $env:NOTES_FILE,
            "--target", $env:GITHUB_SHA
          )
          if ($env:PRERELEASE -eq "true") { $flags += "--prerelease" }

          gh release create $env:RELEASE_TAG @flags
          if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败，退出码 $LASTEXITCODE。" }

          gh release upload $env:RELEASE_TAG $env:ASSET_PATH
          if ($LASTEXITCODE -ne 0) { throw "上传产物失败，退出码 $LASTEXITCODE。" }

          Write-Host "已发布 $env:RELEASE_TAG。"
