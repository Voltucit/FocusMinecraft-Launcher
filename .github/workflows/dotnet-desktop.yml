name: Build WPF launcher

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore FMLauncher.csproj
      - name: Build launcher
        run: dotnet build FMLauncher.csproj --no-restore -c ${{ matrix.configuration }}
      - uses: actions/upload-artifact@v4
        with:
          name: FMLauncher-${{ matrix.configuration }}
          path: bin/${{ matrix.configuration }}/net9.0-windows/
